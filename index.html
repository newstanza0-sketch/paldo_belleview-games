<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JILI Style Golden Fortune Slot (Pro + Cashout)</title>
    <style>
        :root {
            --gold: #ffd700;
            --dark-gold: #b8860b;
            --neon-glow: #ff007f;
            --green: #00ff66;
        }

        body {
            background: linear-gradient(135deg, #120136, #03001e);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background: radial-gradient(circle, #2a0845, #000000);
            border: 4px solid var(--gold);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px var(--dark-gold), inset 0 0 20px #000;
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        /* SECRET INVISIBLE BUTTON (Para sa may ari lang) */
        .secret-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            background: transparent;
            cursor: pointer;
            z-index: 999;
        }

        /* HIDDEN ADMIN PANEL */
        .admin-panel {
            display: none;
            background: rgba(0, 0, 0, 0.95);
            border: 2px dashed #ff0000;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }

        .admin-panel h3 {
            margin: 0 0 10px 0;
            color: #ff3333;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .admin-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-right: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .header h1 {
            color: var(--gold);
            font-size: 2rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--gold);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #00ffff;
            font-size: 0.9rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #333;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .reel {
            background: linear-gradient(to bottom, #111, #222, #111);
            height: 120px;
            border-radius: 8px;
            border: 2px solid var(--dark-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: inset 0 0 15px #000;
        }

        .spinning {
            animation: blurSpin 0.1s infinite linear;
        }

        @keyframes blurSpin {
            0% { filter: blur(3px); transform: translateY(-5px); }
            50% { filter: blur(5px); transform: translateY(5px); }
            100% { filter: blur(3px); transform: translateY(-5px); }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--gold);
        }

        /* WITHDRAWAL SYSTEM BRANDING */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr;
            margin-bottom: 20px;
        }

        .withdraw-btn {
            background: linear-gradient(to bottom, var(--green), #009933);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 255, 102, 0.2);
            transition: all 0.2s ease;
        }

        .withdraw-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .bet-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .spin-btn {
            flex-grow: 1;
            background: linear-gradient(to bottom, #ff007f, #99004c);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        .spin-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* OVERLAYS & MODALS */
        .announcement, .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid var(--gold);
            padding: 25px;
            border-radius: 15px;
            z-index: 10;
            width: 80%;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .announcement.show, .modal.show {
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .announcement h2, .modal h2 {
            color: var(--gold);
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            text-shadow: 0 0 10px red;
        }

        .modal-input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid var(--gold);
            background: #222;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        .modal-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- SECRET TRIGGER AREA -->
        <div class="secret-trigger" onclick="toggleAdminPanel()"></div>

        <!-- HIDDEN OWNER CONTROLLER -->
        <div class="admin-panel" id="adminPanel">
            <h3>⚙️ Owner Controls</h3>
            <button class="admin-btn" onclick="cheatAddCash()">+₱10,000 Cash</button>
            <button class="admin-btn" id="rateBtn" onclick="toggleWinRate()">Win Rate: Normal</button>
        </div>

        <!-- NOTIFICATION OVERLAY -->
        <div class="announcement" id="announcementBox">
            <h2 id="announcementTitle">BIG WIN!</h2>
            <p id="announcementDetail">Nanalong PHP 0.00</p>
        </div>

        <!-- WITHDRAWAL POPUP MODAL (Simulated for Players) -->
        <div class="modal" id="withdrawModal">
            <h2>💸 WITHDRAW</h2>
            <p>Ipasok ang iyong GCash / PayMaya Number:</p>
            <input type="number" class="modal-input" placeholder="09XXXXXXXXX" id="walletNumber">
            <p>Halaga ng Ika-Cash out (Min: ₱100):</p>
            <input type="number" class="modal-input" placeholder="Magkano?" id="withdrawAmount">
            <br><br>
            <button class="modal-btn" onclick="submitWithdrawal()">IPROSESO</button>
            <button class="modal-btn" style="background:#555; color:#fff;" onclick="closeWithdrawModal()">SERADUHAN</button>
        </div>

        <div class="header">
            <h1>🎰 JILI FORTUNE</h1>
            <div class="subtitle" id="modeDisplay">BASE GAME</div>
        </div>

        <div class="slot-machine">
            <div class="reel" id="reel1">💎</div>
            <div class="reel" id="reel2">👑</div>
            <div class="reel" id="reel3">💰</div>
        </div>

        <div class="dashboard">
            <div class="stat-box">
                <div class="stat-label">Balanseng Pera</div>
                <div class="stat-value" id="balanceDisplay">₱1,000</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Kasalukuyang Taya</div>
                <div class="stat-value" id="betDisplay">₱10</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Huling Panalo</div>
                <div class="stat-value" id="winDisplay">₱0</div>
            </div>
        </div>

        <!-- GREEN WITHDRAW BUTTON FOR PLAYERS -->
        <div class="action-bar">
